name: Encoding Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  encoding:
    name: UTF-8 Mojibake Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check source file encoding
        run: node scripts/detect-mojibake.mjs --all
