# CI Pipeline — runs on every push and pull request
#
# Validates: install, lint, typecheck, build
# Does NOT deploy anything.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint + Typecheck + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint app lib scripts --max-warnings 100

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Build doesn't need real secrets, but Next.js may fail if these are
          # completely absent. Use dummy values for build-time validation.
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          SESSION_SECRET: "build-time-dummy-secret-at-least-32-chars-long"
          NODE_ENV: "production"

      - name: Report
        if: always()
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "- Lint: ${{ steps.lint.outcome || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Typecheck: ${{ steps.typecheck.outcome || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ steps.build.outcome || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
