services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: khmer-vox-tts:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./deploy/production.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DISABLE_INLINE_JOB_WORKER: "true"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    image: khmer-vox-tts:latest
    restart: unless-stopped
    command: ["node", "scripts/job-worker.mjs", "--loop"]
    env_file:
      - ./deploy/production.env
    environment:
      NODE_ENV: production
      JOB_WORKER_BASE_URL: "http://web:3000"
    depends_on:
      web:
        condition: service_healthy
